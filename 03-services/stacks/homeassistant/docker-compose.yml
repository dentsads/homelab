version: '3.8'

services:
  init-config:
    container_name: homeassistant-init
    image: alpine:3.24.3
    restart: "no"
    command:
      - /bin/sh
      - -c
      - |
        set -e
        [ -e /config/automations.yaml ] || printf '[]\n' > /config/automations.yaml
        [ -e /config/scripts.yaml ]     || printf '{}\n' > /config/scripts.yaml
        [ -e /config/scenes.yaml ]      || printf '[]\n' > /config/scenes.yaml
        mkdir -p /config/themes
        if [ ! -e /config/.storage/http ]; then
          mkdir -p /config/.storage
          cp /seed/http.json /config/.storage/http
          chmod 600 /config/.storage/http
        fi
    volumes:
      - hass_config:/config
      - ./seed/http.json:/seed/http.json:ro

  homeassistant:
    container_name: homeassistant
    image: "ghcr.io/home-assistant/home-assistant:2026.11.0"
    restart: unless-stopped
    network_mode: host
    privileged: true
    environment:
      - TZ=Europe/Berlin
    volumes:
      - hass_config:/config
      - /run/dbus:/run/dbus:ro
      - /etc/localtime:/etc/localtime:ro
      - ./configuration.yaml:/config/configuration.yaml:ro
    depends_on:
      init-config:
        condition: service_completed_successfully

volumes:
  hass_config: